[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-bridge"
version = "0.1.0"
description = "Accessible CLI wrapper — makes any command-line tool screen-reader friendly"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Sachin Sampras M" },
]
keywords = ["accessibility", "a11y", "cli", "screen-reader", "wcag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

# Core package: zero dependencies (color domain, screen reader mode, table formatting)
# Optional domains installed separately:
#   pip install a11y-bridge[audio]  — TTS (piper) + STT (vosk)
#   pip install a11y-bridge[askai]  — AI interactive mode (httpx for cleaner API calls)
#   pip install a11y-bridge[all]    — everything

[project.optional-dependencies]
audio = [
    "piper-tts>=1.6.0",
    "vosk>=0.3.45",
]
askai = []  # stdlib urllib is sufficient; httpx is optional for better error handling
all = [
    "piper-tts>=1.6.0",
    "vosk>=0.3.45",
]

[project.scripts]
a11y-bridge = "a11y_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/cli-accessibility/a11y-bridge"
Repository = "https://github.com/cli-accessibility/a11y-bridge"
Issues = "https://github.com/cli-accessibility/a11y-bridge/issues"
