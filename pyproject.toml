[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axcli"
version = "0.1.0"
description = "Accessible CLI wrapper — makes any command-line tool screen-reader friendly"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "Sachin Sampras M" },
]
keywords = ["accessibility", "a11y", "cli", "screen-reader", "wcag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.scripts]
axcli = "axcli.cli:main"

[project.urls]
Homepage = "https://github.com/cli-accessibility/axcli"
Repository = "https://github.com/cli-accessibility/axcli"
Issues = "https://github.com/cli-accessibility/axcli/issues"
